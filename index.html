<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrantes del equipo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        .contenedor {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding: 20px;
        }

        .integrante {
            background: white;
            padding: 15px;
            border-radius: 10px;
        }

        .integrante img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        .integrante h3 {
            color: #333;
        }
    </style>
</head>

<body>

    <h1>Integrantes del equipo</h1>

    <div class="contenedor">

        <div class="integrante">
            <img src="https://raw.githubusercontent.com/waldigustavo-dotcom/waldigustavo-dotcom.github.io/main/Carpeta%20integrantes%20O9/Alejandro%20Alcocer.jpg">
            <h3>Alejandro Alcocer</h3>
        </div>

        <div class="integrante">
            <img src="https://raw.githubusercontent.com/waldigustavo-dotcom/waldigustavo-dotcom.github.io/main/Carpeta%20integrantes%20O9/Angel%20Gonzaga.jpg">
            <h3>Angel Gonzaga</h3>
        </div>

        <div class="integrante">
            <img src="https://raw.githubusercontent.com/waldigustavo-dotcom/waldigustavo-dotcom.github.io/main/Carpeta%20integrantes%20O9/Emiliano%20Carreta.jpg">
            <h3>Emiliano Carreta</h3>
        </div>

        <div class="integrante">
            <img src="https://raw.githubusercontent.com/waldigustavo-dotcom/waldigustavo-dotcom.github.io/main/Carpeta%20integrantes%20O9/Jackeline%20Pool.png">
            <h3>Jackeline Pool</h3>
        </div>

        <div class="integrante">
            <img src="https://raw.githubusercontent.com/waldigustavo-dotcom/waldigustavo-dotcom.github.io/main/Carpeta%20integrantes%20O9/Veronica%20Perera.jpg">
            <h3>Veronica Perera</h3>
        </div>

        <div class="integrante">
            <img src="https://raw.githubusercontent.com/waldigustavo-dotcom/waldigustavo-dotcom.github.io/main/Carpeta%20integrantes%20O9/Waldi%20Baas.jpg">
            <h3>Waldi Baas</h3>
        </div>

    </div>

</body>
    <footer>
        <p>xd 67 gigachad la pagina mas perrona</p>
    </footer>
</html>
